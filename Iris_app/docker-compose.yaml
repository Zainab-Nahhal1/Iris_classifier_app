version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      # Load variables from .env file at root of Iris_app (docker-compose does
      # this automatically). Be sure to set DATABASE_URL, POSTGRES_USER,
      # POSTGRES_PASSWORD and POSTGRES_DB in your .env or override them here.
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      - db
  db:
    image: postgres:latest
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"